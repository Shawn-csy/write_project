# Cloudflare Tunnel reaches the origin through the host loopback port. Only
# that local ingress may supply CF-Connecting-IP; the API receives a single
# canonical IP instead of a caller-controlled forwarding chain.
map $http_cf_connecting_ip $canonical_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

# Apply shared ingress budgets to write methods only. Empty keys for reads are
# ignored by both modules; all API locations inherit the same limits.
map $request_method $write_limit_key {
  default "";
  POST $canonical_client_ip;
  PUT $canonical_client_ip;
  PATCH $canonical_client_ip;
  DELETE $canonical_client_ip;
}
limit_req_zone $write_limit_key zone=site_writes:10m rate=10r/s;
limit_conn_zone $write_limit_key zone=site_write_connections:10m;

# Share one per-source budget across SSR pages and costly public data/media
# reads. Query strings do not change the key, so cache-busting URLs cannot
# evade the budget. Static assets and health probes are outside this class.
map "$request_method:$uri" $dynamic_read_limit_key {
  default "";
  ~^(GET|HEAD):/(?:$|authors/?$|audio-works/?$|voice-actors/?$|activities/?$|demos/?$|resources/?$|sitemap[.]xml$|read/|author/|org/|series/|tag/|resources/|api/public-(?:bundle|personas|organizations|terms-config|media)(?:/|$)) $canonical_client_ip;
}
limit_req_zone $dynamic_read_limit_key zone=site_dynamic_reads:10m rate=20r/s;
limit_conn_zone $dynamic_read_limit_key zone=site_dynamic_connections:10m;

server {
  listen 80;
  server_name _;

  # Use Docker's internal DNS resolver so nginx re-resolves service names
  # after container restarts instead of caching the IP at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Avoid 400 "Request Header Or Cookie Too Large" when auth/session cookies grow.
  client_header_buffer_size 16k;
  large_client_header_buffers 4 32k;
  client_max_body_size 12m;
  limit_req zone=site_writes burst=24 nodelay;
  limit_req zone=site_dynamic_reads burst=40 nodelay;
  limit_req_status 429;
  limit_conn site_write_connections 8;
  limit_conn site_dynamic_connections 12;
  limit_conn_status 429;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  # Cloudflare JavaScript Detections injects /cdn-cgi/challenge-platform scripts
  # into transformable HTML. Keep Next.js ISR Cache-Control intact and add the
  # standard directive Cloudflare documents as the opt-out signal.
  add_header Cache-Control "no-transform" always;

  # Use variables to force nginx to re-resolve service names via Docker DNS.
  set $backend "write_project-backend";
  set $public "write_project-public";

  # Process-level probe for the public ingress. Dependency readiness is exposed
  # separately by the backend and public application health endpoints.
  location = /healthz {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Next.js owns its generated assets for SSR public pages.
  # This must appear before the generic static asset regex below.
  location ^~ /_next/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js public static assets (OG images, fonts, etc.) — must appear before
  # the generic image-caching regex so ^~ wins and proxies to Next instead of
  # falling through to nginx's static root (which has no /og/ directory).
  location ^~ /og/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Favicon and app icons — proxy to Next.js (app/favicon.ico, app/public/favicon.svg,
  # app/apple-icon.png, and public/apple-touch-icon.png).
  # Must appear before the static asset regex below, which would otherwise route
  # these to nginx's static root where no file exists.
  location = /favicon.ico {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /favicon.svg {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /apple-touch-icon.png {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-term cache for hashed static assets
  location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|jpeg|gif|webp|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Public gallery data endpoints — always routed through Next.js BFF so the
  # public frontend owns its own API boundary regardless of deployment method.
  location ~ ^/api/public-(bundle|personas|organizations|terms-config)$ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public media proxy routes are implemented by the Next.js public app. Keep
  # them ahead of the generic /api/ backend route so external cover images can
  # be served without exposing the backend media path directly.
  location = /api/public-media {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/public-media/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/public-terms-acceptances {
    client_max_body_size 4k;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Bound public form bodies at ingress; the backend applies tighter limits to
  # each route before JSON parsing. Upload endpoints keep the 12 MiB limit.
  location ~ ^/api/(public-feedback|public-demo-submissions|public-audio-work-submissions|production-resource-submissions|production-resource-profile-submissions|external-author-profile-submissions|voice-actor-profile-submissions|voice-actor-claims|my-demo-submissions(?:/[^/]+)?)$ {
    client_max_body_size 128k;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/(public-scripts/[^/]+/like|public-external-scripts/[^/]+/view|scripts/[^/]+/view)$ {
    client_max_body_size 4k;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Large, authenticated content routes keep their existing allowances. All
  # other backend API bodies are capped by the generic location below.
  location ~ ^/api/scripts(?:/(?!reorder$)[^/]+)?$ {
    client_max_body_size 12m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/export/ {
    client_max_body_size 12m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/media/upload {
    client_max_body_size 12m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/(admin|studio)/external-public-scripts(?:/[^/]+)?$ {
    client_max_body_size 4m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    client_max_body_size 1m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ^~ prevents the image-caching regex block above from intercepting /media/*.webp etc.
  location ^~ /media/ {
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # User-uploaded media assets are content-addressed (hash in filename) — cache aggressively.
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
  }

  # All /.well-known/* requests go to Next.js so supported documents get 200
  # and unsupported paths get a real 404 instead of the Vite SPA fallback.
  location ^~ /.well-known/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Sitemap and robots owned by Next.js app/sitemap.ts and app/robots.ts.
  location = /sitemap.xml {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /llms.txt {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static pages served by Next.js SSR.
  location ~ ^/(authors|audio-works|voice-actors|activities|demos)/?$ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /about {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /privacy {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /terms {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Route public reader pages to Next.js SSR (replaces Python seo.py injection).
  location /read/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Route public author/org/series pages to Next.js SSR.
  location /author/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /org/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /series/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /license {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /help {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /tag/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # An explicit exact match prevents nginx from redirecting /resources to
  # /resources/ merely because the proxied detail prefix ends with a slash.
  location = /resources {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /resources/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Homepage — Next.js SSR gallery (Phase 4).
  location = / {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Retired legacy URL — no longer served, do not redirect to homepage.
  location = /gallery {
    return 410;
  }

  # Workspace route ownership contract.
  # Only real React Router entry points may receive the Vite SPA shell.
  location ~ ^/(login|dashboard|studio|studio/demos|admin|community|superadmin|works|works/external|series|settings|settings/markers|identity)/?$ {
    try_files /index.html =404;
  }

  location ~ ^/(edit|works)/[^/]+/?$ {
    try_files /index.html =404;
  }

  # Unknown paths must be real 404 responses. Never send the SPA shell here:
  # doing so creates soft-404s, bogus canonicals, and client-side noindex noise.
  location / {
    return 404;
  }
}
