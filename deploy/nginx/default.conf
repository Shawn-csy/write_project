# Cloudflare Tunnel reaches the origin through the host loopback port. Only
# that local ingress may supply CF-Connecting-IP; the API receives a single
# canonical IP instead of a caller-controlled forwarding chain.
map $http_cf_connecting_ip $canonical_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

# Apply shared ingress budgets to write methods only. Empty keys for reads are
# ignored by both modules; all API locations inherit the same limits.
map $request_method $write_limit_key {
  default "";
  POST $canonical_client_ip;
  PUT $canonical_client_ip;
  PATCH $canonical_client_ip;
  DELETE $canonical_client_ip;
}
limit_req_zone $write_limit_key zone=site_writes:10m rate=10r/s;
limit_conn_zone $write_limit_key zone=site_write_connections:10m;

# Share one per-source budget across costly public data/media reads. Query strings do not change the key, so cache-busting URLs cannot
# evade the budget. Static assets and health probes are outside this class.
map "$request_method:$uri" $dynamic_read_limit_key {
  default "";
  ~^(GET|HEAD):/(?:authors/?$|audio-works/?$|voice-actors/?$|activities/?$|demos/?$|resources/?$|sitemap[.]xml$|read/|author/|org/|series/|tag/|resources/|api/public-(?:bundle|resource-directory|personas|organizations|terms-config|media)(?:/|$)) $canonical_client_ip;
}
limit_req_zone $dynamic_read_limit_key zone=site_dynamic_reads:10m rate=20r/s;
limit_conn_zone $dynamic_read_limit_key zone=site_dynamic_connections:10m;

server {
  listen 80;
  server_name _;

  # Use Docker's internal DNS resolver so nginx re-resolves service names
  # after container restarts instead of caching the IP at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Avoid 400 "Request Header Or Cookie Too Large" when auth/session cookies grow.
  client_header_buffer_size 16k;
  large_client_header_buffers 4 32k;
  client_max_body_size 12m;
  limit_req zone=site_writes burst=24 nodelay;
  limit_req zone=site_dynamic_reads burst=40 nodelay;
  limit_req_status 429;
  limit_conn site_write_connections 8;
  limit_conn site_dynamic_connections 12;
  limit_conn_status 429;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  # Preserve origin payloads across Cloudflare transformations.
  add_header Cache-Control "no-transform" always;

  # Use variables to force nginx to re-resolve service names via Docker DNS.
  set $backend "write_project-backend";

  # Process-level ingress probe; API readiness has its own endpoint.
  location = /healthz {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Legacy public assets and pages move to their canonical Pages origin.
  # This must appear before the generic static asset regex below.
  location ^~ /_next/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Legacy OG assets redirect before generic Studio asset caching.
  location ^~ /og/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Public icons live on the canonical Pages origin.
  location = /favicon.ico {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /favicon.svg {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /apple-touch-icon.png {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # FastAPI owns the public JSON boundary for Pages and Studio.
  location ~ ^/api/public-(bundle|resource-directory|personas|organizations|terms-config)$ {
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Media prefixes beat the static asset regex, including .webp paths.
  location = /api/public-media {
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/public-media/ {
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/public-terms-acceptances {
    client_max_body_size 4k;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Bound public form bodies at ingress; the backend applies tighter limits to
  # each route before JSON parsing. Upload endpoints keep the 12 MiB limit.
  location ~ ^/api/(public-feedback|public-demo-submissions|public-audio-work-submissions|production-resource-submissions|production-resource-profile-submissions|external-author-profile-submissions|voice-actor-profile-submissions|voice-actor-claims|my-demo-submissions(?:/[^/]+)?)$ {
    client_max_body_size 128k;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/(public-scripts/[^/]+/like|public-external-scripts/[^/]+/view|scripts/[^/]+/view)$ {
    client_max_body_size 4k;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Large, authenticated content routes keep their existing allowances. All
  # other backend API bodies are capped by the generic location below.
  location ~ ^/api/scripts(?:/(?!reorder$)[^/]+)?$ {
    client_max_body_size 12m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/export/ {
    client_max_body_size 12m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/media/upload {
    client_max_body_size 12m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/(admin|studio)/external-public-scripts(?:/[^/]+)?$ {
    client_max_body_size 4m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    client_max_body_size 1m;
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Prefix protects every media extension from Studio asset caching.
  location ^~ /media/ {
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    # User-uploaded media assets are content-addressed (hash in filename) — cache aggressively.
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";

    location ~* ^/media/.+\.webp$ {
      proxy_pass http://$backend:1091;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $canonical_client_ip;
      proxy_set_header X-Forwarded-For $canonical_client_ip;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Content-Type;
      add_header Content-Type "image/webp" always;
      # User-uploaded media assets are content-addressed (hash in filename) — cache aggressively.
      add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }
  }

  # Pages owns discovery documents and their 404 responses.
  location ^~ /.well-known/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Sitemap and robots owned by Pages app/sitemap.ts and app/robots.ts.
  location = /sitemap.xml {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /robots.txt {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /llms.txt {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Static pages served by Pages public.
  location ~ ^/(authors|audio-works|voice-actors|activities|demos)/?$ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /about {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /privacy {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /terms {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Public reader paths preserve their complete URI on the canonical origin.
  location ^~ /read/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Public author, organization and series detail pages live on Pages.
  location ^~ /author/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location ^~ /org/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location ^~ /series/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /license {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location = /help {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location ^~ /tag/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Keep the original /resources spelling and query during canonical redirects.
  location = /resources {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  location ^~ /resources/ {
    return 308 https://open-scripts.shawnup.com$request_uri;
  }

  # Studio entry point on the local ingress; public homepage is served by Pages.
  location = / {
    try_files /index.html =404;
  }

  # Retired legacy URL — no longer served, do not redirect to homepage.
  location = /gallery {
    return 410;
  }

  # Workspace route ownership contract.
  # The Studio writing tab fetches this file.
  location = /random_text.json {
    try_files /random_text.json =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Only real React Router entry points may receive the Vite SPA shell.
  location ~ ^/(login|dashboard|studio|studio/demos|admin|community|superadmin|works|works/external|series|settings|settings/markers|identity)/?$ {
    try_files /index.html =404;
  }

  location ~ ^/(edit|works)/[^/]+/?$ {
    try_files /index.html =404;
  }

  # Long-term cache for hashed static assets
  location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|jpeg|gif|webp|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Unknown paths must be real 404 responses. Never send the SPA shell here:
  # doing so creates soft-404s, bogus canonicals, and client-side noindex noise.
  location / {
    return 404;
  }
}


# API-only host for the static Cloudflare Pages site. The browser calls this
# origin cross-origin, so every /api and /media request goes straight to
# FastAPI, which owns the CORS allowlist.
server {
  listen 80;
  server_name api-open-scripts.shawnup.com;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_header_buffer_size 16k;
  large_client_header_buffers 4 32k;
  client_max_body_size 4m;
  limit_req zone=site_writes burst=24 nodelay;
  limit_req_status 429;
  limit_conn site_write_connections 8;
  limit_conn_status 429;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

  add_header Cache-Control "no-transform" always;

  set $api_backend "write_project-backend";

  location = /healthz {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Public media proxy fetches remote bytes; bound this new exposure without
  # changing the API host's existing public JSON/snapshot read policy.
  location = /api/public-media {
    limit_req zone=site_writes burst=24 nodelay;
    limit_req zone=site_dynamic_reads burst=40 nodelay;
    limit_conn site_write_connections 8;
    limit_conn site_dynamic_connections 12;
    proxy_pass http://$api_backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public media proxy fetches remote bytes; bound this new exposure without
  # changing the API host's existing public JSON/snapshot read policy.
  location ^~ /api/public-media/ {
    limit_req zone=site_writes burst=24 nodelay;
    limit_req zone=site_dynamic_reads burst=40 nodelay;
    limit_conn site_write_connections 8;
    limit_conn site_dynamic_connections 12;
    proxy_pass http://$api_backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    proxy_pass http://$api_backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /media/ {
    proxy_pass http://$api_backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_ip;
    proxy_set_header X-Forwarded-For $canonical_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* ^/media/.+\.webp$ {
      proxy_pass http://$api_backend:1091;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $canonical_client_ip;
      proxy_set_header X-Forwarded-For $canonical_client_ip;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Content-Type;
      add_header Content-Type "image/webp" always;
      add_header Cache-Control "no-transform" always;
    }
  }

  location / {
    return 404;
  }
}
