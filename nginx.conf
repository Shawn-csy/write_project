server {
  listen 80;
  server_name _;

  # Use Docker's internal DNS resolver so nginx re-resolves service names
  # after container restarts instead of caching the IP at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Avoid 400 "Request Header Or Cookie Too Large" when auth/session cookies grow.
  client_header_buffer_size 16k;
  large_client_header_buffers 4 32k;
  client_max_body_size 12m;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  # Use variables to force nginx to re-resolve service names via Docker DNS.
  set $backend "write_project-backend";
  set $public "write_project-public";

  # Next.js owns its generated assets for SSR public pages.
  # This must appear before the generic static asset regex below.
  location ^~ /_next/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js public static assets (OG images, fonts, etc.) — must appear before
  # the generic image-caching regex so ^~ wins and proxies to Next instead of
  # falling through to nginx's static root (which has no /og/ directory).
  location ^~ /og/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-term cache for hashed static assets
  location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|jpeg|gif|webp|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Public gallery data endpoints — always routed through Next.js BFF so the
  # public frontend owns its own API boundary regardless of deployment method.
  location ~ ^/api/public-(bundle|personas|organizations|terms-config)$ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ^~ prevents the image-caching regex block above from intercepting /media/*.webp etc.
  location ^~ /media/ {
    proxy_pass http://$backend:1091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # User-uploaded media assets are content-addressed (hash in filename) — cache aggressively.
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
  }

  # Sitemap and robots owned by Next.js app/sitemap.ts and app/robots.ts.
  location = /sitemap.xml {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static pages served by Next.js SSR.
  location = /about {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /privacy {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /terms {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Route public reader pages to Next.js SSR (replaces Python seo.py injection).
  location /read/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Route public author/org/series pages to Next.js SSR.
  location /author/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /org/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /series/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /license {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /help {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /tag/ {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Homepage — Next.js SSR gallery (Phase 4).
  location = / {
    proxy_pass http://$public:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Retired legacy URL — no longer served, do not redirect to homepage.
  location = /gallery {
    return 410;
  }

  # Workspace routes stay on Vite SPA.
  location /dashboard {
    try_files $uri $uri/ /index.html;
  }

  location /edit/ {
    try_files $uri $uri/ /index.html;
  }

  location /studio {
    try_files $uri $uri/ /index.html;
  }

  location /settings {
    try_files $uri $uri/ /index.html;
  }

  # Remaining Vite SPA routes (login, etc.).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
