services:
  write_project-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-write_project}
      - POSTGRES_USER=${POSTGRES_USER:-write_project}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    volumes:
      - ./server/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-write_project} -d ${POSTGRES_DB:-write_project}"]
      interval: 5s
      timeout: 5s
      retries: 20

  write_project-backend:
    image: write_project-backend:${DEPLOY_TAG:-latest}
    build:
      context: ./server
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in production}
      - DB_PATH=/data/scripts.db
      - DB_AUTO_CREATE_TABLES=${DB_AUTO_CREATE_TABLES:-1}
      - DB_RUN_LEGACY_MIGRATIONS=${DB_RUN_LEGACY_MIGRATIONS:-1}
      - PORT=1091
      - ENVIRONMENT=production
      - ALLOW_X_USER_ID=0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://open-scripts.shawnup.com}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CREDENTIALS=/secrets/firebase-service-account.json
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      - ADMIN_USER_EMAILS=${ADMIN_USER_EMAILS}
      - VITE_API_URL=${VITE_API_URL}
      - NEXTJS_REVALIDATE_URL=http://write_project-public:3000/api/revalidate
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    volumes:
      - ./server/data:/data
      - ./server/secrets:/secrets:ro
      - ./dist:/app/dist:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:1091/api/health/ready', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      write_project-postgres:
        condition: service_healthy

  write_project-frontend-build:
    image: node:20-alpine
    working_dir: /app
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"

  write_project-frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "1090:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      write_project-frontend-build:
        condition: service_completed_successfully
      write_project-backend:
        condition: service_healthy
      write_project-public:
        condition: service_healthy

  write_project-public:
    image: write_project-public:${DEPLOY_TAG:-latest}
    build:
      context: .
      dockerfile: apps/public/Dockerfile
      args:
        BACKEND_API_URL: ${BACKEND_API_URL:-http://write_project-backend:1091}
    restart: unless-stopped
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://write_project-backend:1091}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://open-scripts.shawnup.com}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(response => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      write_project-backend:
        condition: service_healthy
