name: Documentation checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/checks/check-docs.py'
      - 'scripts/tests/test_check_docs.py'
      - 'scripts/checks/check-ci-contracts.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/checks/check-docs.py'
      - 'scripts/tests/test_check_docs.py'
      - 'scripts/checks/check-ci-contracts.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/checks/check-ci-contracts.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_check_docs.py'
      - run: python3 scripts/checks/check-docs.py
