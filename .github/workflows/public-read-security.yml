name: Public read and security contracts

on:
  pull_request:
    paths:
      - 'server/**'
      - 'apps/public/**'
      - 'apps/studio/**'
      - 'packages/**'
      - 'deploy/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'config/**'
      - 'Dockerfile*'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'apps/public/**'
      - 'apps/studio/**'
      - 'packages/**'
      - 'deploy/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'config/**'
      - 'Dockerfile*'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/**'
      - '!**/*.md'

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r server/requirements.txt --strict
      - name: Check CI workflow contracts
        run: python3 scripts/checks/check-ci-contracts.py
      - name: Check release orchestration contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check production network boundary
        run: python3 scripts/checks/check-prod-network-boundary.py
      - name: Check isolated production ingress routing and limits
        run: RUN_NGINX_INTEGRATION=1 python3 -m unittest discover -s scripts/tests -p 'test_site_release_nginx.py'
      - name: Check backend contracts
        run: python -m pytest -q tests
        working-directory: server
        env:
          PYTHONPATH: .

  public-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check studio and shared package types
        run: npm run typecheck
      - name: Check durable sync status receipts
        run: node --test scripts/tests/test_sync_status.mjs
      - name: Check studio and shared package contracts
        run: npm test -- --project main
      - name: Build studio
        run: npm run build
      - name: Check public app contracts
        run: npm test -- apps/public
      - name: Check public app types
        run: npx tsc --noEmit -p apps/public/tsconfig.json
      - name: Build production Pages exports
        run: python3 scripts/checks/check-public-builds.py
