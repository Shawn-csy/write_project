name: Refresh published content

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, macOS, write-project-prod]
    timeout-minutes: 45
    env:
      DOCKER_CONTEXT: orbstack
      SSL_CERT_FILE: /etc/ssl/cert.pem
      WP_RELEASE_ROOT: /Users/shanti/Desktop/write_project/releases
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve complete live release
        id: live
        run: |
          sha=$(python3 scripts/release/content-refresh.py resolve-source)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.live.outputs.sha }}
          fetch-depth: 0
      - name: Locate the refresh command in the live checkout
        id: refresh
        run: |
          if test -f scripts/release/content-refresh.py; then
            entry=scripts/release/content-refresh.py
          elif test -f scripts/content-refresh.py; then
            entry=scripts/content-refresh.py
          else
            echo 'Deploy a complete release containing the content refresh command before enabling refresh'
            exit 1
          fi
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: python3 "$REFRESH_ENTRY" run
        env:
          REFRESH_ENTRY: ${{ steps.refresh.outputs.entry }}
