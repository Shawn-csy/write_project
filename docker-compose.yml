
services:
  write_project-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: write_project
      POSTGRES_PASSWORD: write_project
      POSTGRES_DB: write_project
    volumes:
      - ./server/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "write_project"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  write_project-backend:
    env_file:
      - .env
    build:
      context: ./server
    ports:
      - "1091:1091"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_PATH=/data/scripts.db
      - DB_AUTO_CREATE_TABLES=${DB_AUTO_CREATE_TABLES:-1}
      - DB_RUN_LEGACY_MIGRATIONS=${DB_RUN_LEGACY_MIGRATIONS:-1}
      - PORT=1091
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CREDENTIALS=/secrets/firebase-service-account.json
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      - ADMIN_USER_EMAILS=${ADMIN_USER_EMAILS}
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./server/data:/data
      - ./server/secrets:/secrets:ro
      - ./dist:/app/dist:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:1091/api/health/ready', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      write_project-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m

  write_project-frontend-build:
    image: node:20-alpine
    working_dir: /app
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"

  write_project-frontend:
    image: nginx:alpine
    ports:
      - "1090:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      write_project-frontend-build:
        condition: service_completed_successfully
      write_project-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
