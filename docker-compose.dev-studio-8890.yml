services:
  dev-studio-8890:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8890:80"
    volumes:
      - ./dist-dev-studio-8890:/usr/share/nginx/html:ro
      - ./nginx.dev-studio-8890.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dev-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev-api:
    external: true
    name: write-project-dev-api-8891_default
